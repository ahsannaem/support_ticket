services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for your local database}
      POSTGRES_DB: langchain
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain"]
      interval: 5s
      timeout: 5s
      retries: 5
  agent:
    build: .
    env_file: .env
    environment:
      POSTGRES_CONNECTION_STRING: postgresql+psycopg://langchain:${POSTGRES_PASSWORD}@pgvector:5432/langchain
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - support-state:/app/.support-data
    # Use docker compose run --rm agent <runtime arguments>.
    command: ["--help"]
volumes:
  pgvector-data:
  support-state:
