[project]
name = "support-ticket-agent"
version = "0.1.0"
description = "LangGraph support drafting with durable checkpoints and exact-payload human approval"
authors = [{ name = "Muhammad Ahsan Naeem", email = "ahsan.340@protonmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-core>=1,<2", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
live = ["langchain-google-genai>=3,<5", "langchain-postgres>=0.0.15,<1", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
studio = ["langgraph-cli[inmem]>=0.3,<1"]

[project.scripts]
support-ticket = "agent.runtime:main"

[build-system]
requires = ["setuptools>=73", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
